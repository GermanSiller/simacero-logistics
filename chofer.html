<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SIMACERO | Modo Operador</title>
    
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; font-family: 'Inter', sans-serif; background: #0f172a; }
        #map { height: 60%; width: 100%; background: #cbd5e1; }
        .driver-card { background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(10px); border-top: 2px solid rgba(255, 204, 0, 0.2); }
    </style>
</head>
<body class="flex flex-col h-screen w-screen">

    <div id="map"></div>

    <div class="absolute top-4 right-4 z-50 bg-blue-600 text-white px-3 py-2 rounded-xl text-[10px] font-bold uppercase tracking-wider flex items-center gap-2 shadow-lg">
        <span class="animate-ping h-2 w-2 rounded-full bg-green-400 inline-block"></span>
        GPS Chofer Activo
    </div>

    <div class="flex-1 driver-card flex flex-col p-4 space-y-4 justify-between z-10 shadow-2xl">
        
        <div class="flex justify-between items-center border-b border-white/10 pb-2">
            <div>
                <p class="text-[9px] text-slate-400 uppercase font-black tracking-widest">Unidad Asignada</p>
                <h2 id="driver-unit-title" class="text-sm font-black text-yellow-400">CARGANDO UNIDAD...</h2>
            </div>
            <div class="text-right">
                <p class="text-[9px] text-slate-400 uppercase font-black tracking-widest">Estatus</p>
                <span class="text-xs font-bold text-green-400">En Tránsito</span>
            </div>
        </div>

        <div class="flex flex-col flex-1 bg-black/20 rounded-xl p-3 overflow-hidden border border-white/5">
            <p class="text-[9px] font-bold text-slate-500 uppercase tracking-wider mb-2 border-b border-white/5 pb-1"><i class="ri-message-3-line"></i> Mensajes con Central</p>
            <div id="driver-chat-stream" class="flex-1 overflow-y-auto space-y-2 text-xs flex flex-col justify-end">
                <div class="bg-white/5 p-2 rounded-lg text-slate-300 self-start max-w-[85%]">
                    <p class="text-[8px] text-yellow-400 font-bold">BODEGA</p>
                    Ruta optimizada enviada. Favor de reportar salida y subir evidencia al entregar.
                </div>
            </div>
            <div class="mt-2 flex gap-2">
                <input type="text" id="driver-msg" class="flex-1 bg-slate-800 text-white text-xs rounded-lg px-3 py-2 outline-none" placeholder="Responder a Matriz...">
                <button onclick="sendToCentral()" class="bg-yellow-400 text-black px-3 rounded-lg text-sm"><i class="ri-send-plane-fill"></i></button>
            </div>
        </div>

        <div class="flex gap-2">
            <label class="flex-1 bg-slate-800 border border-white/10 text-white py-3 rounded-xl text-xs font-bold uppercase tracking-wider text-center cursor-pointer flex items-center justify-center gap-2 hover:bg-slate-700">
                <i class="ri-camera-lens-line text-yellow-400 text-base"></i> 
                <span id="photo-status">Tomar Foto Evidencia</span>
                <input type="file" accept="image/*" capture="environment" class="hidden" onchange="handleEvidence(this)">
            </label>
            <button onclick="finishRoute()" class="bg-yellow-400 text-black px-6 rounded-xl text-xs font-black uppercase tracking-wider shadow-md">
                Terminar
            </button>
        </div>

    </div>

    <script>
        let map, directionsService, directionsRenderer, userMarker;
        const bodegaSimacero = { lat: 25.57881, lng: -100.23874 };

        function initDriverPage() {
            // 解析 Parámetros URL (Unidad y coordenadas de ruta)
            const urlParams = new URLSearchParams(window.location.search);
            const unit = urlParams.get('unit') || "Unidad de Reparto";
            const stopsRaw = urlParams.get('stops');

            document.getElementById('driver-unit-title').innerText = unit.toUpperCase();

            // Cargar Mapa Móvil
            map = new google.maps.Map(document.getElementById("map"), {
                zoom: 14, center: bodegaSimacero, disableDefaultUI: true
            });

            directionsService = new google.maps.DirectionsService();
            directionsRenderer = new google.maps.DirectionsRenderer({ 
                map: map, polylineOptions: { strokeColor: '#2563eb', strokeWeight: 6 }
            });

            // Pintar la ruta exacta optimizada si existen coordenadas
            if (stopsRaw) {
                let coords = stopsRaw.split('|').map(pair => {
                    let parts = pair.split(',');
                    return { location: new google.maps.LatLng(parseFloat(parts[0]), parseFloat(parts[1])), stopover: true };
                });

                directionsService.route({
                    origin: bodegaSimacero, destination: bodegaSimacero,
                    waypoints: coords, optimizeWaypoints: false, // Ya viene acomodada desde matriz
                    travelMode: 'DRIVING'
                }, (res, status) => {
                    if (status === 'OK') directionsRenderer.setDirections(res);
                });
            }

            // PASO CLAVE: SOLICITAR PERMISO DE GPS EN TIEMPO REAL
            if (navigator.geolocation) {
                navigator.geolocation.watchPosition((position) => {
                    let pos = { lat: position.coords.latitude, lng: position.coords.longitude };
                    
                    if (!userMarker) {
                        // Crear el marcador del operador en movimiento
                        userMarker = new google.maps.Marker({
                            position: pos, map: map,
                            icon: { path: google.maps.SymbolPath.CIRCLE, scale: 8, fillColor: '#22c55e', fillOpacity: 1, strokeColor: '#ffffff', strokeWeight: 2 },
                            title: "Tu ubicación"
                        });
                    } else {
                        userMarker.setPosition(pos); // Actualizar coordenadas dinámicas
                    }
                }, () => { console.log("Error de acceso GPS"); }, { enableHighAccuracy: true });
            }
        }

        function sendToCentral() {
            let msg = document.getElementById('driver-msg').value;
            if(!msg) return;
            let stream = document.getElementById('driver-chat-stream');
            let div = document.createElement('div');
            div.className = "bg-yellow-400 text-black p-2 rounded-lg text-xs self-end max-w-[85%] text-right font-medium";
            div.innerHTML = `<p class="text-[8px] font-black uppercase text-slate-800">CHOFER</p>${msg}`;
            stream.appendChild(div);
            document.getElementById('driver-msg').value = "";
            stream.scrollTop = stream.scrollHeight;
        }

        function handleEvidence(input) {
            if (input.files && input.files[0]) {
                document.getElementById('photo-status').innerText = "✓ Evidencia Capturada";
                alert("Foto adjuntada con éxito. Lista para subir a base de datos de Simacero.");
            }
        }

        function finishRoute() {
            alert("Ruta marcada como entregada. Regresando a Matriz Nueva Estanzuela.");
            window.close();
        }
    </script>
    <script async src="https://maps.googleapis.com/maps/api/js?key=AIzaSyARlpmhw29k70jWDXb-NLnNt7wMUoIjaOM&libraries=geometry&callback=initDriverPage"></script>
</body>
</html>
